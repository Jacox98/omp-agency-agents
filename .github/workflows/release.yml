name: Publish GitHub release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: omp-agency-agents-*.tgz
          if-no-files-found: error
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Publish archive and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" omp-agency-agents-*.tgz --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
